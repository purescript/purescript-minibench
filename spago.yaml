package:
  name: minibench
  description: A minimal benchmarking library
  build:
    strict: true
    pedanticPackages: true
  publish:
    version: 4.0.2
    license: BSD-3-Clause
    location:
      githubOwner: purescript
      githubRepo: purescript-minibench
  dependencies:
    - console: ">=6.0.0 <7.0.0"
    - effect: ">=4.0.0 <5.0.0"
    - integers: ">=6.0.0 <7.0.0"
    - numbers: ">=9.0.0 <10.0.0"
    - prelude: ">=6.0.0 <7.0.0"
    - refs: ">=6.0.0 <7.0.0"
  test:
    main: Test.Main
    strict: true
    pedanticPackages: true
    dependencies: []
workspace: {}
